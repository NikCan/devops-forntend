apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-lesson
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-lesson
  template:
    metadata:
      labels:
        app: frontend-lesson
    spec:
      imagePullSecrets:
        - name: dockerhub-cred
      containers:
        - name: frontend-lesson
          image: ${FRONTEND_IMAGE}
          resources:
            requests:
              cpu: "50m"
              memory: "50Mi"
            limits:
              cpu: "60m"
              memory: "60Mi"

          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-lesson-service
spec:
  selector:
    app: frontend-lesson
  ports:
    - port: 8080
      targetPort: 80
  type: ClusterIP
