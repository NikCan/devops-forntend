name: Deploy k8s

on:
  push:
    branches: [develop]

jobs:
  checks:
    name: Code Checks
    uses: ./.github/workflows/checks.yml

  build:
    name: Build Image
    needs: [checks]
    uses: ./.github/workflows/build.yml
    with:
      image_name: "devops-frontend"
      vite_api_url: ${{ vars.VITE_API_URL }}
    secrets: inherit

  deploy:
    name: Deploy to Production
    needs: [build]
    uses: ./.github/workflows/deploy-argocd.yml
    with:
      helm_path: HelmCharts/frontend-lesson/values-production.yaml
      image_name: ${{ needs.build.outputs.image_sha }}
      branch: main # ветка argocd-lesson
      gitops_repo: nikcan/argocd-lesson
      argocd_app_name: frontend-lesson
      argocd_server: ${{ vars.ARGOCD_SERVER }}
    secrets:
      gitops_token: ${{ secrets.GITOPS_TOKEN }}
      argocd_auth_token: ${{ secrets.ARGOCD_AUTH_TOKEN }}

  notify:
    name: Send Notification
    needs: [checks, build, deploy]
    if: always()
    uses: ./.github/workflows/notify.yml
    with:
      checks_result: ${{ needs.checks.result }}
      build_result: ${{ needs.build.result }}
      deploy_result: ${{ needs.deploy.result }}
    secrets: inherit
