on:
  workflow_call:
    inputs:
      helm_path:
        description: Путь к values.yaml внутри gitops-репо
        type: string
        required: true
      image_name:
        description: Полное имя образа с тегом
        type: string
        required: true
      branch:
        description: Целевая ветка в gitops-репо
        type: string
        required: true
      gitops_repo:
        description: owner/repo gitops-репозитория
        type: string
        required: true
      argocd_app_name:
        description: Имя Application в ArgoCD
        type: string
        required: true
      argocd_server:
        description: Адрес ArgoCD сервера
        type: string
        required: true
    secrets:
      gitops_token:
        description: GitHub Token с правом на запись в gitops-репо
        required: true
      argocd_auth_token:
        description: ArgoCD auth token
        required: true

jobs:
  update-helm-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.gitops_repo }}
          token: ${{ secrets.gitops_token }}
          ref: ${{ inputs.branch }}
          path: gitops-repo

      - name: Install yq
        run: |
          mkdir -p $HOME/.local/bin
          curl -sL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -o $HOME/.local/bin/yq
          chmod +x $HOME/.local/bin/yq
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Update values.yaml
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          HELM_PATH: ${{ inputs.helm_path }}
        run: |
          cd gitops-repo
          yq e -i ".image.tag = \"$IMAGE_NAME\"" "$HELM_PATH"

      - name: Commit and push to new branch
        env:
          HELM_PATH: ${{ inputs.helm_path }}
          APP_NAME: ${{ inputs.argocd_app_name }}
          IMAGE_NAME: ${{ inputs.image_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          cd gitops-repo
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          BRANCH_NAME="update-image-$RUN_ID"
          git checkout -b "$BRANCH_NAME"
          git add "$HELM_PATH"
          git commit -m "feat($APP_NAME): update image to $IMAGE_NAME"
          git push origin "$BRANCH_NAME"

      - name: Create and merge Pull Request
        env:
          GH_TOKEN: ${{ secrets.gitops_token }}
          GITOPS_REPO: ${{ inputs.gitops_repo }}
          APP_NAME: ${{ inputs.argocd_app_name }}
          IMAGE_NAME: ${{ inputs.image_name }}
          BRANCH: ${{ inputs.branch }}
          RUN_ID: ${{ github.run_id }}
        run: |
          cd gitops-repo
          PR_URL=$(gh pr create \
            --repo "$GITOPS_REPO" \
            --title "[$APP_NAME] Update image to $IMAGE_NAME" \
            --body "Automated update of image tag." \
            --base "$BRANCH" \
            --head "update-image-$RUN_ID")

          echo "PR created: $PR_URL"

          gh pr merge "$PR_URL" --repo "$GITOPS_REPO" --squash --delete-branch


  sync-argocd:
    needs: [update-helm-chart]
    runs-on: ubuntu-latest
    steps:
      - name: Install ArgoCD CLI & Sync
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.argocd_auth_token }}
          ARGOCD_SERVER: ${{ inputs.argocd_server }}
          APP_NAME: ${{ inputs.argocd_app_name }}
        run: |
          sudo curl -sSL -o /usr/local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          sudo chmod +x /usr/local/bin/argocd

          argocd app sync "$APP_NAME" --insecure
          argocd app wait "$APP_NAME" --insecure

